const KMOT=['Masana otur, ilk adımı at. Gerisi kendiliğinden gelir. ✏️','Bugün sadece 25 dakika. Sonra mola, söz! 🍅','Her gün biraz çalışan, bir günde çok çalışandan daha ileri gider. 🐢🏆','Başlamak için mükemmel olmak gerekmez, başlayarak mükemmelleşirsin. 🚀','Defterin açık, kalemin hazır; gerisi sende! 📒','Yanlış yapmak öğrenmenin parçasıdır. Denemeye devam! 💪','Bugün çalıştığın her konu yarın seni daha rahat ettirecek. 🌟','Telefonu bir kenara bırak, kendine bir hediye ver: odaklanmak. 🎯','Küçük adımlar, büyük başarılar. Bugün hangi adımı atıyorsun? 👣','Sen düşündüğünden daha yeteneklisin. Kanıtlamak için masaya geç! 🦸','Bir sayfa oku, bir soru çöz, bir konuyu tekrar et. İşte bu kadar! ✅','Çalışma saatin geldi. Kendinle gurur duyacağın bir gün olsun! 😊','Zor konular da çalıştıkça kolaylaşır. Bırakma! 🧩','Hedefin ne? Şimdi ona bir adım daha yaklaş. 🌈'];
const p2=n=>String(n).padStart(2,'0');
const nowL=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const dayIdx=()=>(new Date().getDay()+6)%7;
const itm=t=>({t:t,d:0});
const progPct=s=>{const a=[].concat.apply([],s.prog||[]);return pct(a.filter(t=>t.d).length,a.length)};
const genProg=dk=>{const pr=[[1,0],[2,4],[1,3],[0,2],[4,3]];return OT.map((x,i)=>i<5?pr[i].map(j=>itm(OSUB[j]+' · '+dk+' dk')).concat([itm('Kitap okuma · 20 dk')]):i==5?[itm('Eksik konulara tekrar · '+dk+' dk'),itm('Haftanın genel tekrarı · '+dk+' dk'),itm('Kitap okuma · 20 dk')]:[itm('Gelecek haftanın planına bak · 10 dk'),itm('Kitap okuma · 20 dk')])};
const streak=s=>{let c=0;for(let i=dayIdx();i>=0;i--){const d=s.prog[i];const ok=d.length&&d.every(t=>t.d);if(ok)c++;else if(i!=dayIdx())break}return c};
const bDays=b=>Math.max(1,Math.round((new Date(b.en||TD())-new Date(b.st))/864e5)+1);
function ensOrt(s){s.books=s.books||[];s.diary=s.diary||[];s.notes=s.notes||[];s.gaps=s.gaps||{};s.ph=s.ph||[];if(!s.prog)s.prog=OT.map(()=>[]);const m=mon(TD());if(!s.pw)s.pw=m;if(s.pw!=m){s.ph.unshift({w:s.pw,p:progPct(s)});s.ph=s.ph.slice(0,8);s.prog.forEach(d=>d.forEach(t=>t.d=0));s.pw=m}}
const sampleOrt=(id,nm,al)=>{const s={id:id,riza:true,name:nm,track:'ORT',alan:al,goal:'Düzenli ders çalışma alışkanlığı',hedef:{tyt:0,ayt:0},tyt:[],ayt:[],week:[40,30,45,0,35,60,0],soru:{goal:0,done:0},abs:0,last:0,pkg:'2027-01-15',pay:{due:'2026-12-05',amt:8000,paid:true},note:'Başlangıç paketi. Hafta içi 2 ders, her gün 20 dk kitap hedefi.',tasks:[],topics:[]};s.prog=genProg(30);s.pw=mon(TD());s.prog.forEach((d,i)=>{if(i<dayIdx())d.forEach((t,k)=>{t.d=(i==1&&k==2)?0:1})});s.ph=[{w:ago(21),p:45},{w:ago(14),p:60},{w:ago(7),p:72}];s.books=[{id:1,t:'Küçük Prens',a:'Antoine de Saint-Exupéry',pg:96,st:ago(20),en:ago(13)},{id:2,t:'Sherlock Holmes: Kırmızı Dosya',a:'Arthur Conan Doyle',pg:140,st:ago(6),en:''}];s.gaps={'Matematik':[{id:1,t:'Kesirlerle işlemler',d:0}],'Fen Bilimleri':[{id:2,t:'Kuvvet ve sürtünme',d:0}]};s.diary=[{id:1,d:ago(1),m:1,x:'Bugün matematik çalıştım, kesirler biraz zordu ama sonunda anladım.'}];s.notes=[{id:1,t:'Türkçe ödevi',x:'Paragraf sorularını bitir',rem:'',rd:0}];if(id!=5){s.books=[];s.gaps={};s.diary=[];s.notes=[]}s.dn=sampleDn(id);return s};
function otg(i,k){const s=cur(),t=s.prog[i][k];t.d=t.d?0:1;if(t.d&&s.prog[i].every(x=>x.d))notify(s.name+' '+OT[i][1]+' programını tamamladı 🎉','Görev');save();render()}
function oadd(i){const v=document.getElementById('pi'+i).value.trim();if(!v)return;cur().prog[i].push(itm(v));save();render()}
function odel(i,k){cur().prog[i].splice(k,1);save();render()}
function mkProg(){const s=cur();if(s.prog.some(d=>d.length)&&!confirm('Mevcut program silinip önerilen program oluşturulsun mu?'))return;s.prog=genProg(+document.getElementById('pdk').value||30);save();render()}
function addBook(){const s=cur(),t=document.getElementById('bt').value.trim();if(!t)return;s.books.unshift({id:Date.now(),t:t,a:document.getElementById('ba').value.trim(),pg:+document.getElementById('bp').value||0,st:document.getElementById('bs').value||TD(),en:document.getElementById('be').value||''});notify(s.name+' yeni kitap ekledi: '+t,'Kitap');save();render()}
function finBook(id){const s=cur(),b=s.books.find(x=>x.id==id);b.en=TD();notify(s.name+' "'+b.t+'" kitabını '+bDays(b)+' günde bitirdi 📚','Kitap');save();render()}
function delBook(id){const s=cur();s.books=s.books.filter(b=>b.id!=id);save();render()}
function saveDiary(){const s=cur(),x=document.getElementById('dx').value.trim();if(!x)return;s.diary.unshift({id:Date.now(),d:document.getElementById('dd').value||TD(),m:S.dm==null?1:S.dm,x:x});S.dm=null;save();render()}
function delDiary(id){const s=cur();s.diary=s.diary.filter(e=>e.id!=id);save();render()}
function addNote(){const s=cur(),t=document.getElementById('nt2').value.trim();if(!t)return;s.notes.unshift({id:Date.now(),t:t,x:document.getElementById('nx').value.trim(),rem:document.getElementById('nr').value||'',rd:0});save();render()}
function nDone(id){const n=cur().notes.find(x=>x.id==id);n.rd=n.rd?0:1;save();render()}
function nDel(id){const s=cur();s.notes=s.notes.filter(x=>x.id!=id);save();render()}
function addGap(i){const s=cur(),sub=OSUB[i],v=document.getElementById('g'+i).value.trim();if(!v)return;(s.gaps[sub]=s.gaps[sub]||[]).push({id:Date.now(),t:v,d:0});if(S.role=='ort')notify(s.name+' '+sub+' dersinde eksik konu ekledi: '+v,'Eksik konu');save();render()}
function gDone(i,id){const g=cur().gaps[OSUB[i]].find(x=>x.id==id);g.d=g.d?0:1;save();render()}
function gDel(i,id){const s=cur();s.gaps[OSUB[i]]=s.gaps[OSUB[i]].filter(x=>x.id!=id);save();render()}
function remHtml(s){if(!s||!s.notes)return'';const due=s.notes.filter(n=>n.rem&&!n.rd&&n.rem<=nowL());return due.map(n=>`<div class='card' style='border:2px solid var(--gold);margin-bottom:10px'><b>⏰ Hatırlatıcı:</b> ${esc(n.t)} ${n.x?'· '+esc(n.x):''} <button class='btn' onclick='nDone(${n.id})'>Tamam</button></div>`).join('')}
const ortMot=()=>{const o=cur();return`<div class='card' style='border:2px solid var(--gold);margin-bottom:14px'><h3>Merhaba ${esc(o&&o.name?o.name.split(' ')[0]:'')}! 👋</h3><p style='font-size:17px'>${KMOT[Math.floor(Date.now()/864e5)%KMOT.length]}</p><button class='btn' onclick='S.showMot=0;render()'>Masaya oturdum</button></div>`};
function tabProg(s){const ti=dayIdx(),pp=progPct(s);return`<div class='card' style='margin-bottom:14px'><div class='row'><span><b>Bu hafta %${pp}</b> tamamlandı · ${streak(s)} gün üst üste 🔥</span>${prog(pp)}</div><div class='row noprint'><span class='note'>Önerilen program: hafta içi her gün 2 ders ve 20 dk kitap okuma, hafta sonu tekrar. İstediğin görevi ekleyebilir ya da silebilirsin.</span><span><input id='pdk' type='number' min='10' max='90' value='30' style='width:70px' aria-label='Ders başına dakika'> dk <button class='btn' onclick='mkProg()'>Önerilen programı oluştur</button></span></div></div><div class='two'>${OT.map((x,i)=>`<div class='card' ${i==ti?`style='border:2px solid var(--gold)'`:''}><h3>${x[1]}${i==ti?' · bugün':''}</h3>${s.prog[i].map((t,k)=>`<div class='row ${t.d?'done':''}'><label class='chk'><input type='checkbox' ${t.d?'checked':''} onclick='otg(${i},${k})'><span>${esc(t.t)}</span></label><button class='btn ghost' style='padding:2px 8px' onclick='odel(${i},${k})' aria-label='Sil'>×</button></div>`).join('')||`<p class='note'>Boş gün</p>`}<div class='row noprint'><input id='pi${i}' placeholder='Görev ekle' style='flex:1;min-width:0'><button class='btn ghost' onclick='oadd(${i})'>Ekle</button></div></div>`).join('')}</div>${s.ph.length?`<div class='card'><h3>Geçmiş haftalar</h3>${chart(s.ph.slice().reverse().map(x=>x.p),100,'Haftalık tamamlama yüzdesi')}<p class='note'>Haftalık program tamamlama yüzdesi</p></div>`:''}`}
function tabKitap(s){const dn=s.books.filter(b=>b.en),ad=dn.length?Math.round(sum(dn.map(bDays))/dn.length):0;return`<div class='grid'><div class='card stat'><b>${dn.length}</b><span>Bitirilen kitap</span></div><div class='card stat'><b>${ad||'—'}</b><span>Ortalama bitirme günü</span></div><div class='card stat'><b>${sum(dn.map(b=>b.pg||0))}</b><span>Okunan sayfa</span></div></div><div class='card noprint' style='margin-bottom:14px'><h3>Yeni kitap ekle</h3><div class='row'><input id='bt' placeholder='Kitabın adı' style='flex:2;min-width:140px'><input id='ba' placeholder='Yazar' style='flex:1;min-width:120px'><input id='bp' type='number' placeholder='Sayfa' style='width:90px'></div><div class='row'><label class='note'>Başlangıç<br><input id='bs' type='date' value='${TD()}'></label><label class='note'>Bitiş (bitirdiyse)<br><input id='be' type='date'></label><button class='btn' onclick='addBook()'>Kaydet</button></div></div><div class='card'><h3>Kitaplarım</h3>${s.books.map(b=>`<div class='row'><span><b>${esc(b.t)}</b>${b.a?' · '+esc(b.a):''}<br><span class='note'>${b.en?bDays(b)+' günde bitirdi'+(b.pg?' · günde ortalama '+Math.round(b.pg/bDays(b))+' sayfa':'')+' · '+b.st+' → '+b.en:'Okuyor: '+bDays(b)+'. gün · başlangıç '+b.st}</span></span><span>${b.en?'':`<button class='btn' onclick='finBook(${b.id})'>Bitirdim</button> `}<button class='btn ghost' onclick='delBook(${b.id})' aria-label='Sil'>×</button></span></div>`).join('')||`<p class='note'>Henüz kitap eklenmedi.</p>`}</div>`}
function tabGunluk(s){if(S.role=='koc')return`<div class='card'><h3>Günlük</h3><p>Günlük öğrenciye özeldir. İçeriği koç ekranında gösterilmez.</p><p class='note'>Kayıt sayısı: ${s.diary.length}${s.diary[0]?' · son kayıt: '+s.diary[0].d:''}</p></div>`;return`<div class='card' style='margin-bottom:14px'><h3>Günlüğüm</h3><p class='note'>Burası sana özel. Günün nasıl geçti, neler öğrendin, yarın ne yapacaksın?</p><input id='dd' type='date' value='${TD()}' aria-label='Tarih'><div class='mood' style='justify-content:flex-start;margin:10px 0'>${MD.map((m,i)=>`<button class='dmb ${S.dm===i?'on':''}' onclick='S.dm=${i};document.querySelectorAll(".dmb").forEach((b,j)=>b.classList.toggle("on",j==${i}))' aria-label='${m[1]}'>${m[0]}<small>${m[1]}</small></button>`).join('')}</div><textarea id='dx' placeholder='Bugün en güzel şey… Bugün öğrendiğim… Yarın için hedefim…' style='min-height:120px'></textarea><p><button class='btn' onclick='saveDiary()'>Kaydet</button></p></div><div class='card'><h3>Eski kayıtlarım</h3>${s.diary.map(e=>`<div class='row' style='align-items:flex-start'><span><b>${e.d}</b> ${MD[e.m]?MD[e.m][0]:''}<br>${esc(e.x)}</span><button class='btn ghost' onclick='delDiary(${e.id})' aria-label='Sil'>×</button></div>`).join('')||`<p class='note'>Henüz kayıt yok.</p>`}</div>`}
function tabNot(s){return`<div class='card noprint' style='margin-bottom:14px'><h3>Yeni not</h3><div class='row'><input id='nt2' placeholder='Başlık' style='flex:1;min-width:140px'></div><textarea id='nx' placeholder='Notun'></textarea><div class='row'><label class='note'>Hatırlatıcı (isteğe bağlı)<br><input id='nr' type='datetime-local'></label><button class='btn' onclick='addNote()'>Kaydet</button></div><p class='note'>Hatırlatıcı zamanı gelince bu sayfanın üstünde görünür. Uygulama açıkken çalışır.</p></div><div class='card'><h3>Notlarım</h3>${s.notes.map(n=>`<div class='row ${n.rd?'done':''}' style='align-items:flex-start'><label class='chk'><input type='checkbox' ${n.rd?'checked':''} onclick='nDone(${n.id})'><span><b>${esc(n.t)}</b>${n.x?'<br>'+esc(n.x):''}${n.rem?`<br><span class='tag'>⏰ ${n.rem.replace('T',' ')}</span>`:''}</span></label><button class='btn ghost' onclick='nDel(${n.id})' aria-label='Sil'>×</button></div>`).join('')||`<p class='note'>Henüz not yok.</p>`}</div>`}
function tabEksik(s){return`<p class='note'>Hangi derste hangi konuda zorlandığını yaz. Çalışıp anladığında işaretle.</p><div class='two'>${OSUB.map((d,i)=>`<div class='card'><h3>${d}</h3>${(s.gaps[d]||[]).map(g=>`<div class='row ${g.d?'done':''}'><label class='chk'><input type='checkbox' ${g.d?'checked':''} onclick='gDone(${i},${g.id})'><span>${esc(g.t)}</span></label><button class='btn ghost' style='padding:2px 8px' onclick='gDel(${i},${g.id})' aria-label='Sil'>×</button></div>`).join('')||`<p class='note'>Eksik konu yok.</p>`}<div class='row noprint'><input id='g${i}' placeholder='Eksik olduğum konu' style='flex:1;min-width:0'><button class='btn ghost' onclick='addGap(${i})'>Ekle</button></div></div>`).join('')}</div>`}
function tabMoti(){const q=S.q==null?Math.floor(Date.now()/864e5)%KMOT.length:S.q,ck=S.ck||[0,0,0,0];return`<div class='card' style='text-align:center;border:2px solid var(--gold);margin-bottom:14px'><h3>Masaya oturma vakti!</h3><p style='font:600 22px/1.3 Fraunces,serif;color:#0b1630;margin:14px 0'>${KMOT[q]}</p><button class='btn ghost' onclick='S.q=(${q}+1+Math.floor(Math.random()*${KMOT.length-1}))%${KMOT.length};render()'>Başka bir söz</button> <button class='btn' onclick='go("pomo")'>Çalışmaya başla (Pomodoro) 🍅</button></div><div class='card'><h3>Masa hazırlığı</h3>${['Telefonu uzağa koydum','Su, defter ve kalemim hazır','Bugünkü ilk görevimi seçtim','25 dakika odaklanmaya hazırım'].map((t,i)=>`<label class='chk row'><input type='checkbox' ${ck[i]?'checked':''} onclick='S.ck=S.ck||[0,0,0,0];S.ck[${i}]=this.checked?1:0'><span>${t}</span></label>`).join('')}</div>`}
function ort(){const L=S.students.filter(x=>x.track=='ORT'),k=S.role=='koc';if(!L.length)return`<div class='top'><h1>Ortaokul paneli</h1></div><p class='note'>Kayıtlı ortaokul öğrencisi yok. Hızlı kayıt ile ekleyebilirsiniz.</p>`;let s=cur();if(!s||s.track!='ORT'){s=L[0];S.sid=s.id}ensOrt(s);const t=S.ot||'prog',TB=[['prog','Haftalık program'],['kitap','Kitap okuma'],['gunluk','Günlüğüm'],['not','Notlar ve hatırlatıcı'],['eksik','Eksik konular'],['moti','Masaya otur']],gp=sum(Object.keys(s.gaps).map(x=>s.gaps[x].filter(g=>!g.d).length));return`<div class='top'><h1>${k?'Ortaokul paneli':'Merhaba '+esc(s.name.split(' ')[0])+' 👋'}</h1>${k?`<select aria-label='Öğrenci seç' onchange='S.sid=+this.value;render()'>${L.map(x=>`<option value='${x.id}'${x.id==S.sid?' selected':''}>${esc(x.name)} · ${esc(x.alan)}</option>`).join('')}</select> <select aria-label='Sınıf' onchange='setGrade(${s.id},this.value)'>${['5. sınıf','6. sınıf','7. sınıf'].map(g=>`<option${g==s.alan?' selected':''}>${g}</option>`).join('')}</select>`:''}</div><div id='rembar'>${S.role=='ort'?remHtml(s):''}</div><div class='grid'><div class='card stat'><b>%${progPct(s)}</b><span>Haftalık program</span></div><div class='card stat'><b>${streak(s)}</b><span>Gün üst üste</span></div><div class='card stat'><b>${s.books.filter(b=>b.en).length}</b><span>Bitirilen kitap</span></div><div class='card stat'><b>${gp}</b><span>Açık eksik konu</span></div></div>${k&&t=='prog'?okMini(s):''}<div class='tb' role='tablist'>${TB.map(x=>`<button class='${t==x[0]?'on':''}' onclick='S.ot="${x[0]}";render()'>${x[1]}</button>`).join('')}</div>${t=='prog'?tabProg(s):t=='kitap'?tabKitap(s):t=='gunluk'?tabGunluk(s):t=='not'?tabNot(s):t=='eksik'?tabEksik(s):tabMoti()}`}
function ortBody(s,mode){ensOrt(s);const dn=s.books.filter(b=>b.en),op=Object.keys(s.gaps).map(x=>[x,s.gaps[x].filter(g=>!g.d)]).filter(x=>x[1].length);return`<div class='card' style='margin-bottom:14px'><h3>${esc(s.name)} · ${esc(s.alan)} ${mode=='aylik'?'aylık gelişim raporu · '+new Date().toLocaleDateString('tr',{month:'long',year:'numeric'}):'haftalık rapor'}</h3><div class='grid'><div class='stat'><b>%${progPct(s)}</b><span>Bu hafta program tamamlama</span></div><div class='stat'><b>${streak(s)}</b><span>Gün üst üste</span></div><div class='stat'><b>${dn.length}</b><span>Bitirilen kitap</span></div><div class='stat'><b>${Math.round(sum(s.week)*(mode=='aylik'?4:1)/60)} sa</b><span>Çalışma süresi</span></div></div>${s.ph.length?`<h3>Haftalık düzen</h3>${chart(s.ph.slice().reverse().map(x=>x.p),100,'Haftalık tamamlama')}`:''}<h3>Kitap okuma</h3>${dn.map(b=>`<div class='row'><span>${esc(b.t)}</span><span class='note'>${bDays(b)} günde</span></div>`).join('')||`<p class='note'>Henüz bitirilen kitap yok.</p>`}<h3 style='margin-top:12px'>Eksik konular</h3>${op.map(x=>`<p><b>${x[0]}:</b> ${x[1].map(g=>esc(g.t)).join(', ')}</p>`).join('')||`<p class='note'>Açık eksik konu yok.</p>`}<p><b>Devamsızlık:</b> ${s.abs}</p>${mode=='aylik'?`<p><b>Koç değerlendirmesi:</b> ${esc(s.deg||'Düzenli ilerleme devam ediyor.')}</p>`:''}</div>`}
const ODERS=['Türkçe','Matematik','Fen Bilimleri','Sosyal Bilgiler','İngilizce','Din Kültürü ve Ahlak Bilgisi','Görsel Sanatlar','Müzik','Beden Eğitimi','Teknoloji ve Tasarım','Bilişim Teknolojileri'];
const LDERS=['Türkçe','Matematik','Fen Bilimleri','T.C. İnkılap Tarihi ve Atatürkçülük','Yabancı Dil','Din Kültürü ve Ahlak Bilgisi'];
const YAY=['Palme','Tonguç','Okyanus','Bilgi Sarmal','Apotemi','345','Hız ve Renk','Çap','Karekök','Limit','3D','Orijinal','Endemik','Aydın','Nitelik','Kafa Dengi','Fenomen','Okul denemesi'];
const GR=[['5','5. sınıf'],['6','6. sınıf'],['7','7. sınıf'],['LGS','LGS (8. sınıf)'],['YKS','YKS']];
const sampleDn=id=>[mkE('ORT',42+id%3*3,ago(35),SUBJ.ORT,'Palme'),mkE('ORT',48+id%3*3,ago(21),SUBJ.ORT,'Okyanus'),mkE('ORT',55+id%3*3,ago(7),SUBJ.ORT,'Palme')];

function front(){const r=S.lr||'ogr',T={ogr:'Öğrenci / Çocuk Girişi',veli:'Veli / Ebeveyn Girişi',koc:'Koç Girişi',ort:'Ortaokul Öğrenci Girişi'};return`<div class='fr'><div class='fh'><img class='ph' src='${IMG_PHOTO}' alt='Merve Özkaya'><div class='tx'><img class='lg' src='${IMG_LOGO}' alt='Merve Özkaya Akademik Güç logosu'><h1>MERVE ÖZKAYA<b>AKADEMİK GÜÇ</b></h1><div class='sub'>ÖĞRENCİ KOÇLUĞU, EĞİTİM VE TERCİH DANIŞMANLIĞI</div><div class='hd'>Bugün hayal ettiğin gelecek için <b>doğru yerdesin!</b></div><p style='margin-top:12px'>Küçük adımlarla, büyük hedeflere birlikte… Sen yaparsın! ♡</p></div><div class='fmob'>Bugün hayal ettiğin gelecek için <b>doğru yerdesin!</b></div></div><div class='lc'><h2>${T[r]}</h2><p class='note' style='text-align:center'>Hayallerine birlikte ulaşalım! ♡</p><div class='rl' role='group' aria-label='Giriş türü'>${[['ogr','Öğrenci / Çocuk'],['veli','Veli / Ebeveyn'],['koc','Koç']].map(x=>`<button class='${r==x[0]?'on':''}' onclick='S.lr="${x[0]}";render()'>${x[1]}</button>`).join('')}</div><input id='lu' placeholder='Kullanıcı adı' aria-label='Kullanıcı adı' autocomplete='username'><input id='lp' type='password' placeholder='Şifre' aria-label='Şifre' autocomplete='current-password' onkeydown='if(event.key=="Enter")doLogin()'>${S.lerr?`<p style='color:#c0392b;text-align:center;margin:6px 0'>${S.lerr}</p>`:''}<button class='btn' onclick='doLogin()'>Giriş Yap →</button><button class='btn ghost' onclick='alert("Kayıt için lütfen Merve Özkaya ile iletişime geçin: 0539 346 13 86")'>Kaydol</button><p class='pn'>Giriş bilgilerini koçundan al. Herkes yalnızca kendi kaydını görür.</p></div><div class='lc' style='margin-top:0'><h3 style='text-align:center;color:#0b1630'>Bugün kendini nasıl hissediyorsun?</h3><div class='mood'>${MD.map((m,i)=>`<button class='${S.mood===i?'on':''}' onclick='S.mood=${i};render()' aria-label='${m[1]}'>${m[0]}<small>${m[1]}</small></button>`).join('')}</div></div><div class='ln'>HER ÖĞRENCİNİN BAŞARI HİKAYESİ VAR ♡</div></div>`}
function doLogin(){const r=S.lr||'ogr',u=(document.getElementById('lu').value||'').trim().toLowerCase(),p=document.getElementById('lp').value||'';let ok=0;S.lerr='';if(CLOUD){cloudLogin(r,u,p);return}
if(r=='koc'){if(u==S.kc.u.toLowerCase()&&p==S.kc.p){ok=1;S.login=0;S.stu=null;S.pend=null;S.role='koc';S.view='ana'}}
else if(r=='ogr'){const st=S.students.find(x=>(x.user||'').toLowerCase()==u&&x.pass==p&&p);if(st){ok=1;S.login=0;S.stu=null;S.role='ogr';S.pend=st.id;S.sid=st.id;S.view='grup'}}
else{const st=S.students.find(x=>(x.vuser||'').toLowerCase()==u&&x.vpass==p&&p);if(st){ok=1;S.login=0;S.role='veli';S.pend=null;S.stu=st.id;S.sid=st.id;S.view='veli'}}
if(!ok)S.lerr='Kullanıcı adı veya şifre hatalı.';render()}
function doLogout(){if(CLOUD){cloudOut();return}if(S.stu&&(S.role=='ogr'||S.role=='ort'))lg('Çıkış',S.stu);S.stu=null;S.pend=null;S.lerr='';S.role='koc';S.login=1;render()}


// ==== İLKOKUL (7-9 yaş) · oyunlaştırılmış çocuk paneli + veli günlüğü + koç paneli ====
const IW=[['☀️','Güneşli','Çok mutluyum'],['🌤️','Parçalı bulutlu','İyiyim'],['☁️','Bulutlu','Biraz durgunum'],['🌧️','Yağmurlu','Üzgünüm'],['⛈️','Fırtınalı','Kızgınım'],['🌈','Gökkuşağı','Heyecanlıyım']];
const IG0=[['🎒','Çantamı kendim hazırladım'],['📚','Ödevimi yaptım'],['📖','15 dakika kitap okudum'],['🦷','Dişlerimi fırçaladım'],['🧸','Odamı topladım'],['😴','Zamanında yattım']];
const IA0=['Farkı bul: iki resim arasındaki 5 farkı bul','Bugün okuduğun hikâyeyi 3 cümleyle anlat','Gözlerini kapat, çevrendeki 5 sesi say','Çarpım tablosundan 5 soru çöz','Bir resim çiz: bugünün en güzel anı','Bir arkadaşına bugün öğrendiğin bir şeyi anlat','Evde 10 tane kırmızı eşya bul','Sevdiğin bir kelimeyle 3 cümle kur'];
const IV0=['Çantasını kendisi hazırladı','Ödevini hatırlatmadan yaptı','Kitap okudu','Ekran süresine uydu','Uyku saatine uydu','Duygularını sözle anlattı'];
const IRZ=[[0,'🌱','Filiz'],[20,'🌼','Çiçek'],[60,'🌳','Ağaç'],[120,'🚀','Roket'],[200,'⭐','Yıldız Kâşif'],[320,'👑','Süper Kâşif']];
const dk=(d)=>{d=d||new Date();const p=x=>String(x).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const dkAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
const dTr=k=>{const a=k.split('-');const d=new Date(+a[0],+a[1]-1,+a[2]);return d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})};
const weekKeys=()=>{const d=new Date(),w=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-w+i);return dk(x)})};
function ilkOf(s){if(!s.ilk)s.ilk={};const c=s.ilk;if(!c.g)c.g=IG0.map((x,i)=>({id:'d'+i,e:x[0],t:x[1]}));c.g.forEach((g,i)=>{if(!g.id)g.id='d'+i});if(!c.h)c.h=[{id:'h0',t:'Bu hafta her gün 15 sayfa kitap okumak'}];c.h=c.h.map((h,i)=>typeof h=='string'?{id:'h'+i,t:h}:h);if(!c.a)c.a=IA0.slice();if(c.o==null)c.o='';if(!s.ilkG)s.ilkG={};if(!s.vgun)s.vgun={};return c}
function ilkDay(s,k){ilkOf(s);k=k||dk();if(!s.ilkG[k])s.ilkG[k]={g:[],h:[],k:0,p:0,a:0};const r=s.ilkG[k];['g','h'].forEach(f=>{if(!r[f])r[f]=[]});return r}
const ilkStarsDay=(s,k)=>{const r=(s.ilkG||{})[k];if(!r)return 0;return Math.min((r.g||[]).length,10)+Math.min((r.h||[]).length,3)+(r.k>0?1:0)+(r.a?1:0)+Math.min(r.p||0,3)+(r.m!=null?1:0)+(r.oy&&r.oy.all?1:0)};
const ilkStars=s=>Object.keys(s.ilkG||{}).reduce((t,k)=>t+ilkStarsDay(s,k),0);
const ilkRz=n=>{let r=IRZ[0],nx=null;IRZ.forEach((x,i)=>{if(n>=x[0]){r=x;nx=IRZ[i+1]||null}});return[r,nx]};
const actOf=s=>{const a=ilkOf(s).a;if(!a.length)return'';const d=new Date(),n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return a[n%a.length]};
function ilkSave(){save();render()}
function ilkMood(i){const s=cur(),r=ilkDay(s);const first=r.m==null;r.m=i;if(first||r._mn!==i){r._mn=i;notify(s.name+' bugün kendini '+IW[i][0]+' "'+IW[i][1]+'" hissediyor','Duygu')}ilkSave()}
function ilkTxt(f,v){const s=cur(),r=ilkDay(s);r[f]=String(v).trim().slice(0,300);save()}
const ilkDone=(c,r)=>c.g.filter(g=>(r.g||[]).indexOf(g.id)>=0).length;
function ilkTog(id){const s=cur(),c=ilkOf(s),r=ilkDay(s),x=r.g.indexOf(id);if(x>=0)r.g.splice(x,1);else{r.g.push(id);ilkFx()}if(ilkDone(c,r)==c.g.length&&c.g.length&&!r.allN){r.allN=1;notify(s.name+' bugünün tüm görevlerini tamamladı ⭐','Görev')}ilkSave()}
function ilkHed(id){const s=cur(),r=ilkDay(s),x=r.h.indexOf(id);if(x>=0)r.h.splice(x,1);else{r.h.push(id);ilkFx()}ilkSave()}
function ilkKitap(v){const s=cur(),r=ilkDay(s),n=Math.max(0,Math.min(500,parseInt(v)||0));const was=r.k;r.k=n;if(n>0&&!was){ilkFx();notify(s.name+' bugün '+n+' sayfa kitap okudu 📖','Kitap')}ilkSave()}
function ilkAct(){const s=cur(),r=ilkDay(s);r.a=r.a?0:1;if(r.a)ilkFx();ilkSave()}
function ilkFx(){try{const e=document.createElement('div');e.className='ifx';e.textContent='⭐';document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}catch(x){}}

function kdetay(t){const s=S.students.find(x=>x.id==S.kdet),f=vfOf(s.id),N=(S.kt&&S.kt[s.id])||[],tab=S.kTab||'form';

 :`<div class='card noprint' style='margin-bottom:14px'><h3>Yeni not</h3><div class='row' style='flex-wrap:wrap;gap:8px;justify-content:flex-start'><select id='kt_tur'><option value='haftalik'>Haftalık izleme</option><option value='aylik'>Aylık gelişim değerlendirmesi</option></select><input type='date' id='kt_tar' value='${dk()}'></div><textarea id='kt_txt' rows='5' placeholder='Bu hafta / ay gözlemler, gelişmeler, hedefler, veliyle konuşulanlar…'></textarea><button class='btn' style='width:auto' onclick='ktAdd(${s.id})'>Notu kaydet</button></div>
  <div class='card'><h3>Notlar</h3>${N.length?N.map(n=>`<div class='ivh'><div class='row'><b>${n.tur=='aylik'?'📅 Aylık':'🗓️ Haftalık'} · ${fD(n.tarih)}</b><span class='noprint'><button class='btn ghost' style='width:auto;padding:4px 10px' onclick='ktEdit(${s.id},"${n.id}")'>Düzenle</button> <button class='btn ghost' style='width:auto;padding:4px 10px' onclick='ktDel(${s.id},"${n.id}")'>Sil</button></span></div><p style='white-space:pre-wrap'>${esc(n.metin)}</p><p class='note' style='font-size:12px'>Kayıt: ${okTime(n.at)}</p></div>`).join(''):'<p class="note">Henüz not yok.</p>'}<p class='noprint'><button class='btn ghost' style='width:auto' onclick='window.print()'>Notları yazdır / PDF</button></p></div>`;
 return`<div class='top'><h1>${esc(s.name)}</h1><span><span class='tag'>${GRN[t]} · ${esc(s.alan||'')}</span> <button class='btn ghost noprint' style='width:auto' onclick='S.kdet=null;render()'>← ${GRN[t]} listesi</button></span></div>
 <div class='card noprint' style='margin-bottom:14px'>🔒 Bu sayfadaki bilgiler gizlidir; yalnızca koç görür.</div>
 <div class='tb noprint' role='tablist'>${T.map(x=>`<button role='tab' class='${tab==x[0]?'on':''}' aria-selected='${tab==x[0]}' onclick='S.kTab="${x[0]}";render()'>${x[1]}</button>`).join('')}</div>${body}<div class='card noprint' style='margin-top:22px;border:1px solid #e8b4ad'><h3 style='color:#b03a2e'>Kaydı kapat / sil</h3><p class='note'>Öğrenci koçluğu bıraktığında, KVKK gereği verileri saklama süresi sonunda silin. Öğrenci verileri, bilgi formu, izleme notları, değerlendirmeler, mesajlar ve giriş hesapları kalıcı olarak silinir. Silmeden önce yedek indirmeniz önerilir.</p><button class='btn ghost' style='width:auto;color:#b03a2e;border-color:#e8b4ad' onclick='ksil(${s.id})'>Kaydı kalıcı olarak sil</button></div>`}
async function ktAdd(sid){const txt=(document.getElementById('kt_txt').value||'').trim();if(!txt){alert('Not boş olamaz.');return}
 const n={tur:document.getElementById('kt_tur').value,tarih:document.getElementById('kt_tar').value||dk(),metin:txt.slice(0,8000),at:new Date().toISOString()};
 if(CLOUD&&CP){const r=await SB.from('koc_takip').insert({student_id:sid,tur:n.tur,tarih:n.tarih,metin:n.metin}).select('id,created_at');if(r.error){alert('Not kaydedilemedi: '+r.error.message);return}n.id=String(r.data[0].id);n.at=r.data[0].created_at}else n.id='l'+Date.now();
 S.kt=S.kt||{};(S.kt[sid]=S.kt[sid]||[]).unshift(n);S.kt[sid].sort((a,b)=>(b.tarih+b.at).localeCompare(a.tarih+a.at));if(!CLOUD)save();render()}
async function ktEdit(sid,id){const n=(S.kt[sid]||[]).find(x=>x.id==id);if(!n)return;const v=prompt('Notu düzenleyin:',n.metin);if(v==null||!v.trim())return;
 if(CLOUD&&CP){const r=await SB.from('koc_takip').update({metin:v.trim().slice(0,8000)}).eq('id',id);if(r.error){alert('Güncellenemedi: '+r.error.message);return}}n.metin=v.trim();if(!CLOUD)save();render()}
async function ktDel(sid,id){if(!confirm('Bu not kalıcı olarak silinsin mi?'))return;if(CLOUD&&CP){const r=await SB.from('koc_takip').delete().eq('id',id);if(r.error){alert('Silinemedi: '+r.error.message);return}}S.kt[sid]=(S.kt[sid]||[]).filter(x=>x.id!=id);if(!CLOUD)save();render()}
async function fLoad(){S.vf={};S.kt={};S.vp={};if(!CLOUD||!CP)return;
 if(CP.role=='koc'||CP.role=='veli'){try{const r=await SB.from('veli_paylasim').select('id,student_id,ay,metin,created_at').order('ay',{ascending:false});(r.data||[]).forEach(x=>{(S.vp[x.student_id]=S.vp[x.student_id]||[]).push({id:String(x.id),ay:x.ay,metin:x.metin,at:x.created_at})})}catch(e){}}
 if(CP.role=='koc'||CP.role=='veli'){const r=await SB.from('veli_forms').select('student_id,data,submitted_at,updated_at');(r.data||[]).forEach(x=>{S.vf[x.student_id]={d:x.data||{},sub:x.submitted_at,upd:x.updated_at}})}
 if(CP.role=='koc'){const r=await SB.from('koc_takip').select('id,student_id,tur,tarih,metin,created_at').order('tarih',{ascending:false}).order('created_at',{ascending:false});(r.data||[]).forEach(x=>{(S.kt[x.student_id]=S.kt[x.student_id]||[]).push({id:String(x.id),tur:x.tur,tarih:x.tarih,metin:x.metin,at:x.created_at})})}}
// ---- Okul ders programı (öğrenci ve koç düzenler, her kayıt tarih-saatle geçmişe yazılır) ----
const OK_PUSH=true;
const OKG=['Pazartesi','Salı','Çarşamba','Perşembe','Cuma'],OKD=['Türkçe','Matematik','Fen Bilimleri','Sosyal Bilgiler','T.C. İnkılap Tarihi','İngilizce','Din Kültürü','Beden Eğitimi','Müzik','Görsel Sanatlar','Bilişim Teknolojileri','Teknoloji ve Tasarım','Seçmeli','Türk Dili ve Edebiyatı','Fizik','Kimya','Biyoloji','Tarih','Coğrafya','Felsefe','Rehberlik','Boş'];
function okEmpty(){const n=7;return{h:Array(n).fill(''),d:Array.from({length:n},()=>Array(5).fill(''))}}
function okOf(s){if(!s.okul||!s.okul.d)s.okul=okEmpty();if(!s.okulLog)s.okulLog=[];if(!s.okulM)s.okulM={};return s.okul}
function okDraft(s){if(S.okdId!==s.id||!S.okd){S.okd=JSON.parse(JSON.stringify(okOf(s)));S.okdId=s.id}return S.okd}
const okTime=t=>{try{return new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return t}};
function okSet(r,c,v){const s=cur();if(!s)return;const d=okDraft(s);v=String(v).trim().slice(0,40);if(c<0)d.h[r]=v.slice(0,11);else d.d[r][c]=v;S.okDirty=1;const b=document.getElementById('okdirty');if(b)b.style.visibility='visible'}
function okRow(k){const s=cur();if(!s)return;const d=okDraft(s);if(k>0){if(d.d.length>=12)return;d.h.push('');d.d.push(Array(5).fill(''))}else{if(d.d.length<=1)return;d.h.pop();d.d.pop()}S.okDirty=1;render()}
function okCancel(){S.okd=null;S.okdId=null;S.okDirty=0;render()}
function okSave(){const s=cur();if(!s)return;const o=okOf(s),n=okDraft(s),ch=[],now=new Date().toISOString(),R=Math.max(o.d.length,n.d.length);
 for(let r=0;r<R;r++){const oh=o.h[r]||'',nh=n.h[r]||'';if(oh!=nh)ch.push((r+1)+'. ders saati: '+(oh||'—')+' → '+(nh||'—'));
  for(let c=0;c<5;c++){const a=(o.d[r]||[])[c]||'',b=(n.d[r]||[])[c]||'';if(a!=b){const w=OKG[c]+' '+(r+1)+'. ders: ';ch.push(w+(!a?b+' eklendi':!b?a+' silindi':a+' → '+b));s.okulM[r+'_'+c]=now}}}
 if(!ch.length){alert('Değişiklik yok.');okCancel();return}
 const ilk=!o.d.some(x=>x.some(Boolean)),by=S.role=='koc'?'Koç':S.role=='veli'?'Veli':'Öğrenci';
 s.okulLog.unshift({t:now,by:by,c:ilk?['Ders programı ilk kez girildi']:ch});s.okulLog=s.okulLog.slice(0,100);
 if(ilk)s.okulM={};
 s.okul=JSON.parse(JSON.stringify(n));S.okd=null;S.okdId=null;S.okDirty=0;
 const who=S.role=='veli'?s.name+' velisi':s.name,msg=who+' okul ders programını '+(ilk?'girdi':'güncelledi ('+ch.length+' değişiklik)');
 if(CLOUD&&CP&&CP.role=='veli'){okCloudSave(s,msg,ilk?[]:ch);return}
 if(CLOUD&&CP&&CP.role=='koc'){S.okMine=S.okMine||{};S.okMine[s.id]=1}
 notify(msg,'Ders programı');save();render();alert('Ders programı kaydedildi.')}
const SRV_OGR=['okul','okulLog','okulM','vgun','ilk','engOdevK','engPlan','engDers','engEk','engOde','engGrp','engP'],SRV_KOC=['vgun','ilkG','engOdevS','engQuiz','engNot'];
async function srvKeep(s,dd,keys){const q=await SB.from('students').select(keys.map(f=>f+':data->'+f).join(',')).eq('id',s.id).maybeSingle();if(q.data)keys.forEach(f=>{if(q.data[f]!=null){dd[f]=q.data[f];s[f]=q.data[f]}})}
async function okCloudSave(s,msg,ch){
 try{const r=await SB.rpc('save_okul',{p_okul:s.okul,p_log:s.okulLog,p_m:s.okulM});if(r.error)throw r.error;
  _h['s'+s.id]=JSON.stringify(splitS(s));notify(msg,'Ders programı');render();
  if(OK_PUSH&&CP.role=='veli'){const b='📅 '+msg+(ch.length?':\n'+ch.slice(0,6).join('\n')+(ch.length>6?'\n…':''):'')+'\n(Otomatik bildirim)';
   const m=await SB.from('messages').insert({student_id:CP.student_id,sender:'veli',body:b}).select('id');
   if(!m.error&&m.data&&m.data[0])fire(SB.functions.invoke('push-notify',{body:{id:m.data[0].id}}))}
  alert('Ders programı kaydedildi. Koçunuza bildirim gönderildi.')
 }catch(e){console.error(e);alert('Ders programı kaydedilemedi: '+(e.message||e)+'\nLütfen daha sonra tekrar deneyin.');try{await cloudLoad()}catch(x){}render()}}

async function okPull(){if(!CLOUD||!CP||CP.role!='koc')return 0;const r=await SB.from('students').select('id,okul:data->okul,okulLog:data->okulLog,okulM:data->okulM,vgun:data->vgun,ilkG:data->ilkG');if(r.error)return 0;let ch=0;
 (r.data||[]).forEach(x=>{const st=S.students.find(y=>y.id==x.id);if(!st)return;['vgun','ilkG'].forEach(f=>{if(x[f]!=null&&JSON.stringify(st[f]||null)!=JSON.stringify(x[f])){const same=_h['s'+st.id]===JSON.stringify(splitS(st));st[f]=x[f];if(same)_h['s'+st.id]=JSON.stringify(splitS(st));ch=1}})});
 (r.data||[]).forEach(x=>{const st=S.students.find(y=>y.id==x.id);if(!st||(S.okMine&&S.okMine[st.id]))return;const a=JSON.stringify([st.okul||null,st.okulLog||null,st.okulM||null]),b=JSON.stringify([x.okul||null,x.okulLog||null,x.okulM||null]);
  if(a!=b){const same=_h['s'+st.id]===JSON.stringify(splitS(st));st.okul=x.okul||undefined;st.okulLog=x.okulLog||undefined;st.okulM=x.okulM||undefined;if(same)_h['s'+st.id]=JSON.stringify(splitS(st));if(S.okdId===st.id&&!S.okDirty){S.okd=null;S.okdId=null}ch=1}});return ch}
function okTable(s,edit){const d=edit?okDraft(s):okOf(s),wk=Date.now()-7*864e5,M=s.okulM||{};
 return`<div class='scroll'><table class='okt'><tr><th style='width:36px'>#</th><th style='width:92px'>Saat</th>${OKG.map(g=>`<th>${g}</th>`).join('')}</tr>${d.d.map((row,r)=>`<tr><td><b>${r+1}</b></td><td>${edit?`<input value='${esc(d.h[r]||'')}' placeholder='${r?'':'08:30'}' aria-label='${r+1}. ders saati' onchange='okSet(${r},-1,this.value)' style='width:80px'>`:esc(d.h[r]||'')}</td>${row.map((v,c)=>{const m=M[r+'_'+c],nw=m&&new Date(m).getTime()>wk;return`<td${nw?` class='okn' title='Değişti: ${okTime(m)}'`:''}>${edit?`<input list='okdl' value='${esc(v)}' aria-label='${OKG[c]} ${r+1}. ders' onchange='okSet(${r},${c},this.value)' style='width:100%;min-width:96px'>`:(esc(v)||'<span class="note">—</span>')}</td>`}).join('')}</tr>`).join('')}</table></div>${edit?`<datalist id='okdl'>${OKD.map(x=>`<option value='${x}'>`).join('')}</datalist>`:''}`}
function okLast(s){const l=(s.okulLog||[])[0];return l?`<p class='note'>Son değişiklik: <b>${okTime(l.t)}</b> · ${l.by}</p>`:`<p class='note'>Ders programı henüz girilmedi.</p>`}
function okHist(s){const L=s.okulLog||[];return`<div class='card' style='margin-top:14px'><h3>Değişiklik geçmişi</h3>${L.length?L.slice(0,30).map(x=>`<div style='padding:8px 0;border-bottom:1px solid #eee2c4'><b>${okTime(x.t)}</b> <span class='tag'>${x.by}</span><div class='note' style='margin-top:4px'>${x.c.map(esc).join('<br>')}</div></div>`).join(''):'<p class="note">Henüz değişiklik yok.</p>'}</div>`}
function okulp(){const k=S.role=='koc';let s=cur();if(k&&!s&&S.students.length){s=S.students[0];S.sid=s.id}if(!s)return`<div class='top'><h1>Okul ders programı</h1></div><p class='note'>Kayıtlı öğrenci yok.</p>`;okOf(s);const ed=k||S.role=='veli'||S.role=='eng';
 return`<div class='top'><h1>Okul ders programı</h1>${k?`<select aria-label='Öğrenci seç' onchange='S.okd=null;S.okDirty=0;S.sid=+this.value;render()'>${S.students.map(x=>`<option value='${x.id}'${x.id==s.id?' selected':''}>${esc(x.name)} · ${x.track=='ORT'?esc(x.alan):x.track}</option>`).join('')}</select>`:''}</div>
 <div class='card'>${okLast(s)}<p class='note'>${k?'Öğrencinin okuldaki haftalık ders programı. Veli değişiklik yaptığında size bildirim gelir. Son 7 günde değişen dersler altın çerçeveyle işaretlenir; üzerine gelince değişiklik tarihi görünür.':S.role=='eng'?'Okuldaki haftalık ders programını gir. Programın değişirse burada güncelle ve <b>Kaydet</b> düğmesine bas; öğretmenin değişikliği tarih ve saatiyle görür.':S.role=='veli'?'Çocuğunuzun okuldaki haftalık ders programını girin. Program değişirse burada güncelleyip <b>Kaydet</b> düğmesine basın; koçunuz değişikliği tarih ve saatiyle görür ve bildirim alır.':'Okuldaki ders programın. Programı velin girer; bir değişiklik varsa velinle paylaş.'}</p>${okTable(s,ed)}
 ${ed?`<p id='okdirty' class='note' style='visibility:${S.okDirty&&S.okdId===s.id?'visible':'hidden'};color:#b5651d'>Kaydedilmemiş değişiklik var. Kaydet düğmesine basmayı unutma.</p><div class='row noprint' style='justify-content:flex-start;gap:8px;flex-wrap:wrap'><button class='btn' style='width:auto' onclick='okSave()'>Kaydet</button><button class='btn ghost' style='width:auto' onclick='okRow(1)'>+ Ders satırı</button><button class='btn ghost' style='width:auto' onclick='okRow(-1)'>− Son satırı sil</button><button class='btn ghost' style='width:auto' onclick='okCancel()'>Vazgeç</button></div>`:''}</div>${okHist(s)}`}
